[package]
name = "wayside-bindings"
version = "0.1.0"
edition = "2021"
description = "The thin Python binding over the wayside crate, carrying no logic of its own"
license = "MIT"

[lib]
name = "wayside"
crate-type = ["cdylib", "rlib"]

[dependencies]
wayside-core = { package = "wayside", path = ".." }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
