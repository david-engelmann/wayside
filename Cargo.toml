[package]
name = "wayside"
version = "0.1.0"
edition = "2021"
description = "Checkpointing for agent sessions that snapshots the working state of files, env, and agent memory, so any run can resume, fork, or rewind."
license = "MIT"

[lib]
name = "wayside"
path = "src/lib.rs"

[[bin]]
name = "wayside"
path = "src/bin/wayside.rs"

[[bin]]
name = "codepoint_scan"
path = "src/bin/codepoint_scan.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
fs2 = "0.4"
getrandom = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[dev-dependencies]
libc = "0.2"
