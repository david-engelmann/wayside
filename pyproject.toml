# Packaging metadata for the wayside package, which lands with
# Round 1. The pytest configuration sits below the project tables.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wayside"
version = "0.1.0"
description = "Checkpointing for agent sessions that snapshots the working state of files, env, and agent memory, so any run can resume, fork, or rewind."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
wayside = "wayside.cli:main"

[tool.setuptools]
packages = ["wayside"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
