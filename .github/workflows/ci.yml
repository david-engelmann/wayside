name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.91.1"
          components: rustfmt, clippy
      - name: Run the local gate
        run: cargo test
      - name: Run the codepoint scan
        run: cargo run --bin codepoint_scan
      - name: Check the formatting
        run: cargo fmt --check
      - name: Run the linter
        run: cargo clippy --all-targets -- -D warnings

  binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.91.1"
      - name: Build the binding and run the smoke test
        run: |
          python -m venv .venv-binding
          . .venv-binding/bin/activate
          python -m pip install maturin==1.16.0 pytest==9.2.0
          maturin develop --manifest-path bindings/Cargo.toml
          python -m pytest tests/test_binding_smoke.py
